<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxing Career Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: fight-night broadcast and a working boxing gym, tense and spare
   IDEA: the gym is home; panels are the clipboard on the trainer's wall, the fight is a TV broadcast
   PICTURE: your own fighter, full bleed in a lit gym; the ring under one spotlight on fight night
   COLOUR and TYPE: near-black, red corner vs blue corner, gold for what matters; Barlow Condensed
   LAYOUT: 3D fills the screen; a side column holds menus (bottom sheet on phones) */
:root{color-scheme:dark;--green:#3fd18a;--bg:#07080c;--ink:#f2efe8;--dim:#9aa0ad;--red:#d7262e;--blue:#2f6fe4;--gold:#e8b931;--panel:rgba(10,12,18,.88);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(34px,6vw,48px);font-weight:800}
h2{font-size:30px;font-weight:800;margin-bottom:10px}
h3{font-size:20px;font-weight:600;color:var(--dim);margin:14px 0 6px}
p{margin:0 0 12px;color:var(--dim);max-width:62ch}
button{font:600 17px "Barlow Condensed",sans-serif;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:4px;min-height:44px;padding:0 16px;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[aria-pressed=true]{background:var(--gold);color:#111;border-color:var(--gold)}
button.go{background:var(--red);border-color:var(--red);font-size:22px;font-weight:800;padding:0 28px}
button.go:hover{background:#e83a42}
button.wide{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
button.wide small{font:500 14px Barlow,sans-serif;color:var(--dim)}
input[type=text],select{font:16px Barlow,sans-serif;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:4px;min-height:44px;padding:0 12px;width:100%}
select option{background:#14161d}
input[type=range]{width:100%;accent-color:var(--gold);min-height:32px}
label{display:block;font:600 15px "Barlow Condensed",sans-serif;color:var(--dim);margin:12px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.sw[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.side{position:fixed;left:16px;top:16px;max-height:calc(100vh - 32px);width:min(390px,calc(100vw - 32px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;backdrop-filter:blur(6px);z-index:5}
.panel{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,4vw,30px);backdrop-filter:blur(6px)}
.card{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0;background:rgba(255,255,255,.03)}
.kicker{font:600 14px "Barlow Condensed",sans-serif;color:var(--gold)}
.big{font:800 26px/1.05 "Barlow Condensed",sans-serif}
.stat{display:grid;grid-template-columns:72px minmax(0,1fr) 34px;gap:8px;align-items:center;font:600 15px "Barlow Condensed",sans-serif;margin:5px 0}
.stat .bar{height:8px}
.stat b{text-align:right;font-variant-numeric:tabular-nums}
.stat .pm{display:flex;gap:4px}
.stat .pm button{min-height:32px;width:32px;padding:0}
.stat.edit{grid-template-columns:72px minmax(0,1fr) 34px 70px}
.hud{position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;padding:12px clamp(10px,3vw,28px);pointer-events:none;font-family:"Barlow Condensed",sans-serif}
.fx{display:grid;gap:4px;align-content:start}
.fx.r{text-align:right}
.nm{font-size:22px;font-weight:800;line-height:1.05;display:flex;gap:8px;align-items:center}
.fx.r .nm{justify-content:flex-end}
.chip{width:12px;height:12px;border-radius:2px;flex:none}
.bar{height:12px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;position:relative}
.bar.s{height:6px}
.bar>i{position:absolute;inset:0 auto 0 0;display:block;transition:width .12s linear}
.fx.r .bar>i{left:auto;right:0}
.bar>b{position:absolute;inset:0 auto 0 0;display:block;background:rgba(255,255,255,.08)}
.fx.r .bar>b{left:auto;right:0}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);font-weight:600}
.clock{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 14px;text-align:center;align-self:start}
.clock .rd{font-size:14px;color:var(--gold);font-weight:600}
.clock .tm{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.msg{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font:800 clamp(40px,9vw,96px)/1 "Barlow Condensed",sans-serif;text-align:center;pointer-events:none;text-shadow:0 4px 30px #000;white-space:nowrap}
.msg small{display:block;font-size:.3em;font-weight:600;color:var(--gold);margin-top:8px}
.pop{position:fixed;font:800 26px "Barlow Condensed",sans-serif;color:var(--gold);pointer-events:none;text-shadow:0 2px 10px #000;animation:pop .9s ease-out forwards;z-index:4}
@keyframes pop{from{opacity:1;transform:translate(-50%,0) scale(1.2)}to{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(120,0,0,.75));opacity:0;transition:opacity .3s}
table{width:100%;border-collapse:collapse;font-size:15px;margin:0 0 16px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;color:var(--dim)}
.tape td:nth-child(2){text-align:center;color:var(--dim)}.tape td:first-child,.tape th:first-child{color:var(--ink)}
.tape th:nth-child(2){text-align:center}
.call{position:fixed;left:50%;top:13%;transform:translateX(-50%);text-align:center;pointer-events:none;font-family:"Barlow Condensed",sans-serif;text-shadow:0 3px 20px #000}
.call .nums{font-size:clamp(48px,9vw,84px);font-weight:800;line-height:1;letter-spacing:.04em}
.call .nums span{opacity:.55}
.call .nums span.done{opacity:1;color:var(--gold)}
.call .nums span.bad{opacity:1;color:var(--red)}
.call .keys{font-size:18px;color:var(--dim);font-weight:600;margin-top:6px}
.call .meta{font-size:16px;color:var(--dim);margin-top:4px}
.stack{display:grid;gap:8px}
.side.right{left:auto;right:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.bind{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px;align-items:center;margin:6px 0;font-size:15px}
.bind button{min-height:38px}
.troph{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.troph.locked{opacity:.45}
.medal{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.coach{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);width:min(580px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;z-index:5}
.coach h2{margin-bottom:6px}
.prog{font:600 16px "Barlow Condensed",sans-serif;color:var(--gold)}
.log{max-height:260px;overflow:auto}
.range-row{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:10px;align-items:center}
#pauseBtn{position:fixed;top:96px;left:50%;transform:translateX(-50%);min-height:36px;padding:0 14px;z-index:3;background:rgba(10,12,18,.7)}
.side,.panel{background:linear-gradient(180deg,rgba(20,22,31,.93),rgba(8,9,13,.93));box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.side{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#menu.first{animation-delay:1.6s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.side h1,.panel h1{background:linear-gradient(180deg,#fff 0%,#f4e8cc 55%,#e8b931 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#menu h1{font-size:clamp(58px,8vw,86px);letter-spacing:-.01em;line-height:.95;margin-bottom:4px}
button.go{background:linear-gradient(180deg,#e8444c,#b3121c);border-color:#e8444c;box-shadow:0 8px 22px rgba(215,38,46,.32)}
button.go:hover{background:linear-gradient(180deg,#f0545b,#c41a24)}
button.wide:hover{border-color:rgba(232,185,49,.6)}
.hud::before{content:"";position:fixed;left:0;right:0;top:0;height:150px;background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:-1;pointer-events:none}
.caption{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);width:max-content;max-width:min(760px,92vw);background:rgba(0,0,0,.66);padding:8px 16px 10px;border-radius:4px;font:500 18px/1.35 Barlow,sans-serif;text-align:center;pointer-events:none;z-index:4}
.caption b{display:block;font:600 13px "Barlow Condensed",sans-serif;color:var(--gold);letter-spacing:.02em}
.lower{position:fixed;left:6vw;bottom:max(15vh,150px);min-width:min(420px,88vw);pointer-events:none;z-index:4;animation:slide .5s cubic-bezier(.2,.8,.2,1) both}
.lower .bar1{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(10,12,18,.95),rgba(10,12,18,.75));padding:10px 18px 8px}
.lower .chip{width:14px;height:44px;border-radius:2px}
.lower .nm2{font:800 clamp(30px,5vw,46px)/1 "Barlow Condensed",sans-serif}
.lower .nk{font:600 18px "Barlow Condensed",sans-serif;color:var(--gold)}
.lower .bar2{background:rgba(232,185,49,.92);color:#111;font:600 16px "Barlow Condensed",sans-serif;padding:5px 18px;display:flex;gap:16px;flex-wrap:wrap}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
#skipBtn{position:fixed;right:16px;bottom:16px;z-index:5;background:rgba(10,12,18,.7)}
@media (prefers-reduced-motion:reduce){.side,.lower{animation:none}}
.drill{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);width:min(640px,92vw);pointer-events:none;z-index:3;font-family:"Barlow Condensed",sans-serif}
.drill .row{display:flex;justify-content:space-between;gap:12px;font-size:18px;font-weight:600;color:var(--ink);text-shadow:0 2px 10px #000;margin:4px 2px}
.meter{position:relative;height:14px;background:rgba(0,0,0,.6);border-radius:7px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.meter.tall{height:26px}
.meter i{position:absolute;inset:0 auto 0 0;transition:width .1s}
.meter .zone{position:absolute;top:0;bottom:0;background:rgba(232,185,49,.3);border-left:2px solid var(--gold);border-right:2px solid var(--gold)}
.meter .needle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;border-radius:2px}
.lane{position:relative;height:58px;background:rgba(0,0,0,.6);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.lane .hitline{position:absolute;left:18%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.lane .note{position:absolute;top:11px;width:36px;height:36px;margin-left:-18px;border-radius:50%;display:grid;place-items:center;font:800 17px "Barlow Condensed",sans-serif;color:#111}
.lane .note.jab{background:var(--gold)}.lane .note.cross{background:#ff5a60}
.lane .note.perfect,.lane .note.good{opacity:.25;transform:scale(1.3)}.lane .note.miss{opacity:.2;background:#666}
.drillrow{display:flex;gap:6px;align-items:stretch;margin:7px 0}
.drillrow .wide{flex:1;margin:0;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left}
.drillrow .wide span{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px}
.drillrow .wide em{font-style:normal;font-weight:500;color:var(--gold);font-size:13px}
.drillrow .wide small{text-align:left;max-width:none}
.drillrow .auto{flex:none;width:86px;font-size:13px;line-height:1.2;padding:6px}
.replaytag{position:fixed;left:24px;bottom:28px;z-index:4;font:800 30px "Barlow Condensed",sans-serif;letter-spacing:.06em;color:#fff;background:var(--red);padding:4px 16px 2px;border-radius:3px;animation:blink 1.2s steps(2) infinite}@keyframes blink{50%{opacity:.55}}
.photobar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:6;display:flex;gap:8px;align-items:center;background:rgba(10,12,18,.85);padding:8px 12px;border-radius:8px}.photobar span{color:var(--dim);font-size:14px;margin-right:6px}
.photoshot{position:fixed;inset:6vh 8vw;z-index:7;background:rgba(10,12,18,.95);padding:14px;border-radius:8px;overflow:auto;text-align:center}.photoshot img{max-width:100%;max-height:70vh;border-radius:4px}
body.photo .hud,body.photo #hint,body.photo #pauseBtn,body.photo .caption,body.photo .pad{display:none!important}
.bracket{padding-left:20px}.bracket li{margin:6px 0;color:var(--dim)}.bracket li.won{color:var(--gold)}.bracket li.now{color:var(--ink);font-weight:600}
.fpv{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:1;background:radial-gradient(ellipse at center,transparent 45%,rgba(120,0,0,.55) 100%)}
.belts{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.belt{background:linear-gradient(180deg,#f7d774,#b8860b);color:#111;font:700 13px "Barlow Condensed",sans-serif;padding:3px 9px;border-radius:3px;box-shadow:inset 0 -3px 0 var(--c)}
.gold{color:var(--gold)}.bad{color:#ff8a8a}.news summary{cursor:pointer;color:var(--dim);margin-top:8px}
button.offer small{display:block;text-align:left;margin-top:3px;line-height:1.35}button.offer{flex-direction:column;align-items:flex-start;margin:7px 0}button.offer span{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}button.offer em{font-style:normal;color:var(--gold);font-size:13px}
.hidden{display:none!important}
.pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;gap:10px;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));pointer-events:none}
.pad .grp{display:grid;gap:6px;pointer-events:auto}
.pad .mv{grid-template-columns:repeat(3,52px)}
.pad .act{grid-template-columns:repeat(3,64px)}
.pad button{min-height:52px;padding:0;font-size:15px;background:rgba(10,12,18,.6);touch-action:none}
.pad button.on{background:var(--gold);color:#111}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;max-width:min(980px,94vw);text-align:center;font:500 14px/1.45 "Barlow Condensed",sans-serif;color:var(--ink);background:rgba(8,9,13,.72);padding:6px 14px;border-radius:6px;pointer-events:none}
.hint.mini{color:var(--dim);background:rgba(8,9,13,.45);font-size:13px}
.mash{position:fixed;left:50%;top:62%;transform:translateX(-50%);width:min(320px,80vw);text-align:center;font:600 18px "Barlow Condensed",sans-serif}
.mash .bar{height:10px;margin-top:6px}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.note{font-size:14px;color:var(--dim)}
.gain{color:#6fd39b;font-weight:600}
.touchonly{display:none}
@media (pointer:coarse){body.fighting .pad{display:flex}.hint{display:none}.touchonly{display:block}.kbonly{display:none}.coach{bottom:auto;top:10px}}
@media (max-width:700px){
  .side,.side.right{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:58vh;padding:16px}
  .nm{font-size:17px}.clock .tm{font-size:26px}.hud{gap:8px}
}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}}
</style>

<canvas id="gl"></canvas>
<div class="vig" id="vig"></div>

  <div class="fx">
    <div class="nm"><span class="chip" style="background:var(--red)"></span><span id="pName">You</span></div>
    <div class="lbl"><span>Head</span><span id="pRec"></span></div>
    <div class="bar"><b id="pHeadCap"></b><i id="pHead" style="background:#f0d04a"></i></div>
    <div class="lbl"><span>Body</span></div>
    <div class="bar s"><i id="pBody" style="background:#e58a3a"></i></div>

    <div class="bar s"><b id="pStamCap"></b><i id="pStam" style="background:#4fc2a3"></i></div>

  </div>
</div>

<aside class="side hidden" id="offers"></aside>
<aside class="side hidden" id="menu"></aside>

<aside class="side hidden" id="settings"></aside>

<script type="module">
import * as THREE from 'three';

/* ================= tutorial ================= */
const TSTEPS = [
  { id: 'move', title: 'Footwork', text: () => `Move with ${K('up')} ${K('left')} ${K('down')} ${K('right')}. You always face your opponent, so left and right circle around him. Walk around the trainer.`, need: 3, unit: 'metres' },
  { id: 'jab', title: 'The jab (1)', text: () => `Press ${K('jab')} to jab the trainer's mitt. It's your fastest, cheapest punch and it sets up everything else.`, need: 3, unit: 'jabs on the mitt' },
  { id: 'cross', title: 'The cross (2)', text: () => `Press ${K('cross')}. The rear hand: slower than the jab, but much harder.`, need: 3, unit: 'crosses on the mitt' },
  { id: 'one2', title: 'The one-two', text: () => `Jab then cross, fast: ${K('jab')} then ${K('cross')}. Snap them together instead of throwing one at a time.`, need: 2, unit: 'one-twos' },
  { id: 'hook', title: 'The lead hook (3)', text: () => `Press ${K('hook')}. It swings around a high guard, but only lands up close.`, need: 2, unit: 'hooks on the mitt' },
  { id: 'upper', title: 'The rear uppercut (6)', text: () => `Press ${K('upper')}. It comes up through the middle of a guard. Short range, like the hook.`, need: 2, unit: 'uppercuts on the mitt' },
  { id: 'body', title: 'Body shots', text: () => `Hold ${K('body')} while you punch to go to the body. Body shots drain your opponent's stamina and how much of it he can get back.`, need: 2, unit: 'body shots' },
  { id: 'block', title: 'Blocking', text: () => `The trainer jabs at you now. Hold ${K('block')} to raise your guard. A block stops most of a head shot, but you can't punch while you hold it.`, need: 3, unit: 'jabs blocked' },
  { id: 'slip', title: 'Slipping', text: () => `Slip his jab instead: when he calls "Jab!", tap ${K('slipL')} or ${K('slipR')}. A slip makes a straight punch miss completely. In a real fight there's no call, so you read his shoulders.`, need: 2, unit: 'jabs slipped' },
  { id: 'stam', title: 'Stamina and damage', text: () => `In a real fight every punch costs stamina. A tired fighter hits slower and softer and his guard drops. Damage also builds over the whole fight, so getting hurt late is worse than early. If you're knocked down, hammer ${K('block')} to beat the count. In a fight, Esc pauses.`, info: true }
];
const TUT = {};
function startTutorial() {
  MODE = 'tutorial'; setScene('gym'); audioInit(); showOnly();
  const f = PR || stockFighter(); P.look(f); P.stats(f); P.mitt = false; P.reset(new V3(0, 0, -.45), 0);
  trainerSetup(.42);
  Object.assign(TUT, { i: 0, n: 0, t: 0, lastJab: -9, last: P.pos.clone(), jabT: 1.6, done: false });
  fightUI(true, 'Esc leaves the tutorial'); $('coach').classList.remove('hidden'); renderCoach();
}
function tutStep() { return TSTEPS[TUT.i]; }
function renderCoach() {
  const c = $('coach');
  if (TUT.done) {
    c.innerHTML = `<div class="kicker">Tutorial complete</div><h2>You're ready</h2><p>That's every tool in the game. Use them in a career, or try a quick fight first.</p>
      <div class="seg">${SAVE.slots.some(Boolean) ? '' : '<button class="go" id="cStart">Start a career</button>'}<button ${SAVE.slots.some(Boolean) ? 'class="go" ' : ''}id="cQuick">Quick fight</button><button id="cMenu">Main menu</button></div>`;
    if ($('cStart')) $('cStart').onclick = () => { SAVE.active = SAVE.slots.findIndex(s => !s); if (SAVE.active < 0) SAVE.active = 0; PR = newProfile(); openCreator(true, toMenu); };
    $('cQuick').onclick = () => openQuick(); $('cMenu').onclick = toMenu;
    return;
  }
  const s = tutStep();
  c.innerHTML = `<div class="kicker">Step ${TUT.i + 1} of ${TSTEPS.length}</div><h2>${s.title}</h2><p>${esc(s.text())}</p>
    ${s.info ? '' : `<div class="prog" id="cProg">${Math.min(Math.floor(TUT.n), s.need)} of ${s.need} ${s.unit}</div>`}
    <div class="seg" style="margin-top:8px">${s.info ? '<button class="go" id="cNext">Next</button>' : '<button id="cSkip">Skip step</button>'}<button id="cExit">Leave tutorial</button></div>`;
  if ($('cNext')) $('cNext').onclick = nextTutStep;
  if ($('cSkip')) $('cSkip').onclick = nextTutStep;
  $('cExit').onclick = exitTutorial;
}
function nextTutStep() {
  TUT.i++; TUT.n = 0; TUT.jabT = 1.4; TUT.fireIn = null;
  P.punch = null; P.queue = []; P.reset(new V3(0, 0, -.45), 0); O.reset(new V3(0, 0, .42), Math.PI); O.punch = null;
  O.mitt = !(tutStep() && (tutStep().id === 'block' || tutStep().id === 'slip'));
  if (TUT.i >= TSTEPS.length) { TUT.done = true; SAVE.tutDone = true; Save.save(); fightUI(false); }
  renderCoach();
}
function tutProgress(by = 1) {
  const s = tutStep(); if (!s || s.info || TUT.done) return;
  const before = Math.floor(TUT.n); TUT.n += by;
  if (Math.floor(TUT.n) !== before && $('cProg')) $('cProg').textContent = `${Math.min(Math.floor(TUT.n), s.need)} of ${s.need} ${s.unit}`;
  if (TUT.n >= s.need) { popText('Nice', P.headPos().add(new V3(0, .3, 0)), '#e8b931'); setTimeout(nextTutStep, 700); TUT.n = -999; }
}
function tutAction(a) {
  const s = tutStep(); if (!s || TUT.done) return;
  if (ACTP[a] && ['jab', 'cross', 'one2', 'hook', 'upper', 'body'].includes(s.id)) {
    P.startPunch(ACTP[a], !!held.body);
    if (s.id === 'body' && held.body) tutProgress();
    if (s.id === 'one2') { if (a === 'jab') TUT.lastJab = TUT.t; else if (a === 'cross' && TUT.t - TUT.lastJab < .75) { tutProgress(); TUT.lastJab = -9; } }
  }
  if (a === 'slipL') P.doSlip(1);
  if (a === 'slipR') P.doSlip(-1);
}
function exitTutorial() { $('coach').classList.add('hidden'); toMenu(); }
function updateTutorial(dt) {
  const s = tutStep(); TUT.t += dt;
  P.inp.mx = P.inp.mz = 0; P.inp.block = false; O.inp.mx = O.inp.mz = 0; O.inp.block = false;
  if (s && s.id === 'move') { playerInput(P); P.inp.block = false; }
  if (s && (s.id === 'block' || s.id === 'slip')) P.inp.block = !!held.block;
  P.stam = Math.max(P.stam, 70); P.head = 100;
  const before = P.pos.clone();
  P.update(dt, O, T0); O.update(dt, P, T0 + 1.3);
  const sep = P.pos.clone().sub(O.pos).setY(0); if (sep.length() < .6) P.pos.copy(O.pos).add(sep.normalize().multiplyScalar(.6));
  if (!s || TUT.done) return;
  if (s.id === 'move') tutProgress(before.distanceTo(P.pos));
  if (['jab', 'cross', 'hook', 'upper'].includes(s.id)) mittLanding(p => { if (p.type === s.id) tutProgress(); });
  else if (s.id === 'one2' || s.id === 'body') mittLanding(() => { });
  if (s.id === 'block' || s.id === 'slip') {
    TUT.jabT -= dt;
    if (TUT.jabT <= 0 && !O.punch && TUT.fireIn == null) { TUT.fireIn = .25; popText('Jab!', O.headPos().add(new V3(0, .25, 0)), '#ff9b6b'); }
    if (TUT.fireIn != null) { TUT.fireIn -= dt; if (TUT.fireIn <= 0) { TUT.fireIn = null; TUT.jabT = rand(1.6, 2.3); O.speed = .5; O.stam = 100; O.startPunch('jab', false); } }
    const p = O.punch;
    if (p && !p.hit && p.phase >= 1) {
      if (P.slip) p.sawSlip = true;
      const g = O.gloves.L.getWorldPosition(new V3()), d = g.distanceTo(P.headPos());
      if (p.phase === 1 && p.k > .5 && d < (s.id === 'slip' ? .2 : .24) * P.s) {
        p.hit = true;
        if (P.blocking) { sfx.block(); P.hs.vp -= .4; if (s.id === 'block') { popText('Blocked', g, '#e8b931'); tutProgress(); } }
        else { sfx.hit(3); P.hs.vp -= 1.6; popText(s.id === 'block' ? `Hold ${K('block')}` : 'Too late', g, '#ff9b6b'); }
      } else if (p.phase === 2 && p.k > .25) {
        p.hit = true;
        if (s.id === 'slip' && p.sawSlip) { popText('Slipped', P.headPos(), '#e8b931'); tutProgress(); }
      }
    }
  }
}

// balance testing: run a whole fight with no rendering, a bot playing the player
