    <div class="lbl"><span>Body</span></div>
    <div class="bar s"><i id="pBody" style="background:#e58a3a"></i></div>
    <div class="lbl"><span>Stamina</span></div>
    <div class="bar s"><b id="pStamCap"></b><i id="pStam" style="background:#4fc2a3"></i></div>
  </div>
  <div class="clock"><div class="rd" id="rd">Round 1 of 3</div><div class="tm" id="tm">1:30</div></div>
  <div class="fx r">
    <div class="nm"><span id="oName">Opponent</span><span class="chip" style="background:var(--blue)"></span></div>
    <div class="lbl"><span id="oRec"></span><span>Head</span></div>
    <div class="bar"><b id="oHeadCap"></b><i id="oHead" style="background:#f0d04a"></i></div>
    <div class="lbl"><span></span><span>Body</span></div>
    <div class="bar s"><i id="oBody" style="background:#e58a3a"></i></div>
    <div class="lbl"><span></span><span>Stamina</span></div>
    <div class="bar s"><b id="oStamCap"></b><i id="oStam" style="background:#4fc2a3"></i></div>
  </div>
</div>
<div class="msg hidden" id="msg"></div>
<div class="mash hidden" id="mash">Hammer Space or tap to beat the count<div class="bar"><i id="mashBar" style="background:var(--gold);width:0"></i></div></div>
<div class="hint hidden" id="hint"></div>
<div class="call hidden" id="call"><div class="nums" id="callNums"></div><div class="keys kbonly" id="callKeys"></div><div class="meta" id="callMeta"></div></div>

<div class="panel" id="loading"><h1>Boxing career prototype</h1><p id="loadTxt">Loading the gym…</p></div>
<aside class="side hidden" id="hub"></aside>
<aside class="side hidden" id="creator"></aside>
<aside class="side hidden" id="trainMenu"></aside>
<div class="panel hidden" id="trainResult"></div>
<div class="panel hidden" id="prefight"></div>
<div class="panel hidden" id="brk"></div>
<div class="panel hidden" id="over"></div>

<div class="pad" id="pad">
  <div class="grp mv">
    <span></span><button data-k="KeyW">▲</button><span></span>
    <button data-k="KeyA">◀</button><button data-k="KeyS">▼</button><button data-k="KeyD">▶</button>
  </div>
  <div class="grp act">
    <button data-k="KeyQ">Slip L</button><button data-k="Space">Block</button><button data-k="KeyE">Slip R</button>
    <button data-k="KeyJ">1 Jab</button><button data-k="KeyK">2 Cross</button><button data-k="ShiftLeft">Body</button>
    <button data-k="KeyU">3 Hook</button><button data-k="KeyI">6 Upper</button><button data-k="KeyC">Cam</button>
  </div>
</div>

    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;

function ai(me, op, dt) {

    if (A.react.t <= 0) {
      const pr = A.react.p; A.react = null;
      if (op.punch === pr && pr.phase < 2 && !me.punch) {
        const r = Math.random(), hb = me.head < 40 ? .2 : 0;

      }

  me.inp.mx = A.lat * .55;
  if (Math.max(Math.abs(me.pos.x), Math.abs(me.pos.z)) > RING - .7) me.inp.mx = A.lat || 1;
  A.t -= dt;
  if (A.t <= 0 && !me.punch && !me.inp.block) {

/* ================= training ================= */
const TRAIN = [
  { id: 'mitts', name: 'Mitt work', desc: 'Throw the combos your trainer calls, on rhythm. Trains speed and power. You play this one.' },
  { id: 'bag', name: 'Heavy bag', desc: 'Rounds on the bag. Builds power.', gains: { power: [2, 4] } },
  { id: 'road', name: 'Roadwork', desc: 'Early-morning runs. Builds cardio.', gains: { cardio: [2, 4] } },
  { id: 'spar', name: 'Sparring', desc: 'Hard rounds with a training partner. Toughens your chin, sharpens your speed.', gains: { chin: [1, 3], speed: [0, 2] } }
];
function gain(stat, amt) { const cur = PR.stats[stat]; const g = Math.max(0, Math.round(amt * (1.25 - cur / 100))); PR.stats[stat] = Math.min(99, cur + g); return g; }
function openTrainMenu() {
  MODE = 'hub';
  $('trainMenu').innerHTML = `<div class="kicker">Week ${PR.week} · ${PR.fightIn} week${PR.fightIn > 1 ? 's' : ''} until fight night</div><h1>Training</h1><p>One session a week. Gains shrink as a stat gets higher.</p>
    ${TRAIN.map(t => `<button class="wide" data-t="${t.id}" style="margin:8px 0"><span>${t.name}</span><small>${t.desc}</small></button>`).join('')}
    <button id="tBack" style="margin-top:8px">Back</button>`;
  showOnly('trainMenu');
  for (const b of $('trainMenu').querySelectorAll('[data-t]')) b.onclick = () => runTraining(b.dataset.t);
  $('tBack').onclick = () => { renderHub(); showOnly('hub'); };
}
function finishWeek(lines, title) {
  PR.fightIn = Math.max(0, PR.fightIn - 1); PR.week++; Save.save(PR);
  $('trainResult').innerHTML = `<h2>${esc(title)}</h2>${lines.join('')}<p class="note">${PR.fightIn ? `${PR.fightIn} week${PR.fightIn > 1 ? 's' : ''} until you fight ${esc(PR.next.name)}.` : `Fight week. Time to face ${esc(PR.next.name)}.`}</p><button class="go" id="trDone">Back to the gym</button>`;
  showOnly('trainResult'); $('trDone').onclick = toHub; $('trDone').focus();
}
function runTraining(id) {
  const t = TRAIN.find(x => x.id === id);
  if (id === 'mitts') return startMitts();
  const lines = Object.entries(t.gains).map(([k, [a, b]]) => { const g = gain(k, rand(a, b)); return `<p>${STAT_KEYS.find(s => s[0] === k)[1]}: <span class="gain">+${g}</span> → ${PR.stats[k]}</p>`; });
  finishWeek(lines, `${t.name} done`);
}
const COMBOS = [[1], [1, 1], [1, 2], [1, 2], [1, 1, 2], [1, 2, 3], [3, 2], [2, 3, 2], [1, 6, 3], [1, 2, 3, 2], [6, 3, 2], [1, 2, 6, 3]];
const NUM = { 1: 'jab', 2: 'cross', 3: 'hook', 6: 'upper' }, KEYNUM = { KeyJ: 1, KeyK: 2, KeyU: 3, KeyI: 6 }, NUMKEY = { 1: 'J', 2: 'K', 3: 'U', 6: 'I' };
const TR = {};
function startMitts() {
  MODE = 'train'; setScene('gym'); audioInit(); showOnly();
  P.look(PR); P.stats(PR); P.mitt = false; P.reset(new V3(0, 0, -.45), 0);
  O.root.visible = true; O.look({ h: 176, reach: 178, build: 2, skin: 1, trunks: 2, gloves: 2, trim: 2, mittColor: 0xc9a46a, shoes: 0x222222 });
  O.stats({ stats: { power: 50, speed: 50, chin: 50, cardio: 50 }, w: 4, build: 1 });
  O.reset(new V3(0, 0, .42), Math.PI); O.mitt = true;
  O.aimFor = p => O.gloves[p.d.hand === 'L' ? 'R' : 'L'].getWorldPosition(new V3());
  const list = []; for (let i = 0; i < 10; i++) list.push(COMBOS[Math.min(COMBOS.length - 1, randInt(0, 3) + Math.floor(i * .9))]);
  Object.assign(TR, { list, i: -1, seq: null, pos: 0, wait: 1.4, t: 0, last: 0, perfect: 0, good: 0, slow: 0, punches: 0, clean: 0, landed: 0, failed: false, done: false });
  fightUI(true, 'Throw what the trainer calls: J = 1 jab · K = 2 cross · U = 3 hook · I = 6 uppercut');
  $('call').classList.remove('hidden'); $('callNums').textContent = 'Ready'; $('callKeys').textContent = ''; $('callMeta').textContent = 'Mitt work · 10 combos';
}
function renderCall(badAt) {
  $('callNums').innerHTML = TR.seq.map((n, i) => `<span class="${i < TR.pos ? 'done' : i === badAt ? 'bad' : ''}">${n}</span>`).join(' · ');
  $('callKeys').textContent = TR.seq.map(n => NUMKEY[n]).join(' · ');
  $('callMeta').textContent = `Combo ${TR.i + 1} of ${TR.list.length}`;
}
function nextCombo() {
  TR.i++; if (TR.i >= TR.list.length) return endMitts();
  TR.seq = TR.list[TR.i]; TR.pos = 0; TR.failed = false; TR.t = 0; TR.last = 0; TR.wait = 0; renderCall();
}
function trainPress(code) {
  const n = KEYNUM[code]; if (!n || !TR.seq || TR.wait > 0 || TR.done) return;
  const now = TR.t, gap = now - TR.last;
  const mitt = O.gloves[PUNCH[NUM[n]].hand === 'L' ? 'R' : 'L'].getWorldPosition(new V3());
  if (n !== TR.seq[TR.pos]) { TR.failed = true; renderCall(TR.pos); popText('Wrong punch', mitt, '#ff6b6b'); TR.wait = .9; return; }
  P.startPunch(NUM[n], false); TR.punches++;
  const grade = TR.pos === 0 ? (gap < .9 ? 2 : gap < 1.4 ? 1 : 0) : (gap < .45 ? 2 : gap < .7 ? 1 : 0);
  if (grade === 2) TR.perfect++; else if (grade === 1) TR.good++; else TR.slow++;
  popText(['Slow', 'Good', 'Perfect'][grade], mitt, ['#ff9b6b', '#f2efe8', '#e8b931'][grade]);
  TR.last = now; TR.pos++; renderCall();
  if (TR.pos >= TR.seq.length) { TR.clean++; TR.wait = .9; }
}
function updateMitts(dt) {
  TR.t += dt;
  if (TR.wait > 0) { TR.wait -= dt; if (TR.wait <= 0) nextCombo(); }
  else if (TR.seq && !TR.done && TR.t - TR.last > (TR.pos === 0 ? 2.6 : 1.4)) { TR.failed = true; renderCall(TR.pos); TR.wait = .9; }
  const p = P.punch;
  if (p && !p.hit && ((p.phase === 1 && p.k > .55) || (p.phase === 2 && p.k < .2))) {
    const side = p.d.hand === 'L' ? 'R' : 'L', g = P.gloves[p.d.hand].getWorldPosition(new V3()), m = O.gloves[side].getWorldPosition(new V3());
    if (g.distanceTo(m) < .2 * P.s) { p.hit = true; TR.landed++; sfx.pad(); O.mittKick[side] = .07; burst(m, new V3(0, .4, 0), 4); }
  }
}
function endMitts() {
  TR.done = true; $('call').classList.add('hidden'); fightUI(false);
  const rhythm = TR.punches ? (TR.perfect + TR.good * .5) / TR.punches : 0, combos = TR.clean / TR.list.length, landed = TR.punches ? TR.landed / TR.punches : 0;
  const gs = gain('speed', 1 + 4 * rhythm), gp = gain('power', 1 + 3 * combos * landed);
  finishWeek([
    `<table><tbody><tr><td>Combos completed</td><td>${TR.clean} of ${TR.list.length}</td></tr><tr><td>On rhythm (perfect / good / slow)</td><td>${TR.perfect} / ${TR.good} / ${TR.slow}</td></tr><tr><td>Punches that hit the mitt</td><td>${TR.landed} of ${TR.punches}</td></tr></tbody></table>`,
    `<p>Speed: <span class="gain">+${gs}</span> → ${PR.stats.speed}</p><p>Power: <span class="gain">+${gp}</span> → ${PR.stats.power}</p>`,
    `<p class="note">${rhythm > .75 ? 'Your trainer nods. Sharp hands today.' : rhythm > .45 ? 'Decent session. Faster between punches next time.' : 'Your trainer wants the combos snapped together, not one punch at a time.'}</p>`
  ], 'Mitt work done');
}

/* ================= HUD & camera ================= */
function bar(id, v, max = 100) { $(id).style.width = clamp(v / max * 100, 0, 100) + '%'; }
function hud() {
  bar('pHead', P.head); bar('pHeadCap', P.headCap); bar('pBody', P.body); bar('pStam', P.stam); bar('pStamCap', P.stamMax);
  bar('oHead', O.head); bar('oHeadCap', O.headCap); bar('oBody', O.body); bar('oStam', O.stam); bar('oStamCap', O.stamMax);
  $('rd').textContent = `Round ${G.round} of ${G.rounds}`;
  const c = Math.max(0, Math.ceil(G.clock)); $('tm').textContent = `${(c / 60) | 0}:${String(c % 60).padStart(2, '0')}`;
  $('pRec').textContent = P.kdFight ? `Down ${P.kdFight}×` : ''; $('oRec').textContent = O.kdFight ? `Down ${O.kdFight}×` : '';
  $('vig').style.opacity = clamp((40 - P.head) / 40, 0, .85);
  const m = $('mash'), show = G.state === 'fight' && P.down && P.down.rising == null && !P.down.final;
  m.classList.toggle('hidden', !show); if (show) $('mashBar').style.width = clamp(P.down.mash / P.down.need * 100, 0, 100) + '%';
}
const camPos = new V3(3, 2, 4), camLook = new V3(0, 1.2, 0);
function updateCamera(dt, t) {
  let pos, look; const narrow = innerWidth < 700, side = !narrow;
  if (MODE === 'hub' || MODE === 'load') {
    const a = .55 + Math.sin(t * .1) * .12; const r = narrow ? 4.6 : 3.0;
    pos = new V3(Math.sin(a) * r, narrow ? 1.2 : 1.55, Math.cos(a) * r); look = new V3(side ? -.75 : 0, narrow ? .05 : 1.15, 0);
  } else if (MODE === 'creator') {
    const a = .35 + Math.sin(t * .25) * .35; const r = narrow ? 4.2 : 2.3;
    pos = new V3(Math.sin(a) * r, narrow ? 1.2 : 1.45, Math.cos(a) * r); look = new V3(side ? -.55 : 0, narrow ? .05 : 1.05, 0);
  } else if (MODE === 'train') {
    pos = new V3(2.4, 1.65, .4); look = new V3(0, 1.3, 0);
  } else if (G.cam === 1 || P.down || O.down) {
    const mid = P.pos.clone().add(O.pos).multiplyScalar(.5), ax = O.pos.clone().sub(P.pos).setY(0).normalize();
    pos = mid.clone().addScaledVector(new V3(ax.z, 0, -ax.x), 3.4).setY(1.75); look = mid.clone().setY(1.15);
  } else {
    pos = P.pos.clone().addScaledVector(P.right(), 1.05).addScaledVector(P.fwd(), -2.05).setY(2.15);
    look = P.headPos().lerp(O.headPos(), .78); look.y -= .3;
  }
  const k = 1 - Math.exp(-dt * 5); camPos.lerp(pos, k); camLook.lerp(look, k);
  camera.position.copy(camPos).add(new V3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(G.shake)); camera.lookAt(camLook);
  G.shake *= Math.exp(-dt * 10);
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < .8 ? 62 : 50; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ================= loop ================= */
let last = performance.now(), T0 = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(.05, (now - last) / 1000); last = now; T0 += rdt;
  if (G.slowT > 0) { G.slowT -= rdt; G.timeScale = .35; } else G.timeScale = 1;
  const dt = rdt * (MODE === 'fight' ? G.timeScale : 1);
  if (P && O) {
    if (MODE === 'hub' || MODE === 'creator') {
      P.inp.mx = P.inp.mz = 0; P.inp.block = false;
      shadow.t -= dt;
      if (shadow.t <= 0 && MODE === 'hub') { shadow.t = rand(1.4, 3.2); const c = pick([['jab'], ['jab', 'cross'], ['jab', 'jab'], ['cross', 'hook'], ['jab', 'cross', 'hook']]); c.forEach((t, i) => i ? P.queue.push([t, false]) : P.startPunch(t, false)); if (Math.random() < .25) setTimeout(() => P.doSlip(pick([1, -1])), 700); }
      P.stam = 100; P.update(dt, ghost, T0);
      updateDust(dt);
    } else if (MODE === 'train') {
      P.inp.mx = P.inp.mz = 0; P.inp.block = false; O.inp.mx = O.inp.mz = 0; O.inp.block = false;
      P.stam = Math.max(P.stam, 60);
      P.update(dt, O, T0); O.update(dt, P, T0 + 1.3); if (!TR.done) updateMitts(dt); updateDust(dt);
    } else if (MODE === 'fight') {
      if (G.state === 'fight') {
        playerInput(P); ai(O, P, dt); G.time += dt;
        P.update(dt, O, G.time); O.update(dt, P, G.time + 1.7);
        const sep = O.pos.clone().sub(P.pos).setY(0), dist = sep.length();
        if (dist < .56 && !P.down && !O.down) { sep.normalize().multiplyScalar((.56 - dist) / 2); O.pos.add(sep); P.pos.sub(sep); }
        checkHit(P, O); checkHit(O, P);
        for (const [f, o] of [[P, O], [O, P]]) if (f.down) updateCount(f, o, dt);
        if (!P.down && !O.down) {
          G.clock -= dt;
          if (G.clock <= 10 && G.clock + dt > 10) noiseHit(3000, 2, .05, .2, 'bandpass');
          if (G.clock <= 0) { if (G.round >= G.rounds) { scoreRound(); endFight(null, 'DEC', ''); } else endRound(); }
        }
        if (Math.random() < .02) __flash(.02); else if (Math.random() < .3) __flash(0);
      } else {
        for (const f of [P, O]) { f.inp.mx = f.inp.mz = 0; f.inp.block = false; f.update(dt, f === P ? O : P, G.time += dt * .5); }
        if (G.state === 'break') { G.breakT -= rdt; if (G.breakT <= 0) nextRound(); }
      }
      if (msgTimer > 0) { msgTimer -= rdt; if (msgTimer <= 0) showMsg('', ''); }
      hud();
    }
  }
  updateSpray(dt); updateCamera(rdt, T0);
  renderer.render(scene, camera);
}
setScene('gym');
requestAnimationFrame(frame);

/* ================= load ================= */
const raw = atob($('glbdata').textContent.trim()), buf = new Uint8Array(raw.length);
for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
const loader = new GLTFLoader();
const parse = () => new Promise((res, rej) => loader.parse(buf.buffer.slice(0), '', res, rej));
Promise.all([parse(), parse(), Save.load()]).then(([a, b, saved]) => {
  P = new Fighter(a, true); O = new Fighter(b, false); O.root.visible = false;
  PR = saved && saved.v === 1 && saved.created ? saved : newProfile();
  if (PR.created && !PR.next) scheduleNext(PR);
  P.look(PR); P.reset(new V3(0, 0, 0), .3);
  window.__game = { G, get P() { return P; }, get O() { return O; }, get PR() { return PR; }, get MODE() { return MODE; }, TR, startFight, toHub, prefight, knockdown, onPress, makeOpp, setPR: p => { PR = p; } };
  if (PR.created) toHub(); else openCreator(true);
  desktopSetup();
}).catch(e => { $('loadTxt').textContent = 'The gym failed to load: ' + e.message; });
}
</script>
